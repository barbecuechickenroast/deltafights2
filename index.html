<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deltarune Fight Simulator</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            user-select: none;
        }
        #game-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <iframe 
        id="game-frame"
        src="https://deltarunesim.com" 
        allow="gamepad; autoplay; keyboard" 
        sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock">
    </iframe>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const frame = document.getElementById('game-frame');
            frame.focus();
            document.body.addEventListener('click', () => {
                frame.focus();
            });
        });
    </script>

</body>
</html>
